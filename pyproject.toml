[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yakushahyoubanki-nel"
version = "0.1.0"
description = "Evidence-Extraction Agent for generation disambiguation and historical entity linking on the early modern Japanese Yakusha Hyobanki"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Bohao Wu" },
    { name = "Akira Maeda" },
    { name = "Ryo Akama" },
]
keywords = [
    "entity-linking", "low-resource", "historical-documents",
    "japanese", "digital-humanities", "large-language-models",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "python-dotenv>=1.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "black>=24.0",
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/BohaoWu/Yakushahyoubanki_NEL"

# NOTE: the code currently runs as scripts from `src/` (see README). Turning it
# into a pip-installable package (dropping the runtime sys.path bootstrap) is
# tracked as future work; until then the tables above serve as project metadata
# and dependency declaration, and the [tool.*] tables below drive the linters.
[tool.setuptools]
py-modules = []

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src_backup_*", "experiment", "data", "log"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501 line-length is enforced by the formatter; the research code has many long
# prompt/URL literals, so leave wrapping to the formatter rather than failing lint.
ignore = ["E501"]
# Never auto-remove imports / redefinitions / unused vars: methods/ relies on a
# sys.path bootstrap before bare imports, and the merged family files carry
# intentional identical duplicate definitions. Report these, don't rewrite them.
unfixable = ["F401", "F811", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["evidence_agent", "nel_models", "config", "dataset", "run_all"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
